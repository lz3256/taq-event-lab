[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taq-event-lab"
version = "0.1.0"
description = "Reproducible joint versus sequential event tokenization experiments on TAQ trades"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "torch>=2.3,<3", "pyarrow>=15", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
wrds = ["wrds>=3.2"]

[project.scripts]
taq-lab = "taq_lab.cli:main"

[tool.setuptools.packages.find]
include = ["taq_lab*"]

[tool.setuptools.package-data]
taq_lab = ["default_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
